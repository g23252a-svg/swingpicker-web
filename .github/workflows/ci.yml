# .github/workflows/ci.yml
# ═══════════════════════════════════════════════
# SwingPicker CI — Push/PR 마다 자동 실행
#
# 체크 항목:
#   1. 순환 참조 검사 (dep_guard)
#   2. Silent Exception 검출 (except:pass 잔존 여부)
#   3. [v20.8] Contract Gate (Policy SSOT + Feature Contract 위반 탐지)
#   4. Import 오류 검사 (모든 .py 파일 구문 체크)
#   5. 정책 일관성 + 체결 엔진 + ML 테스트
# ═══════════════════════════════════════════════
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'         # collector 결과물 커밋은 CI 스킵
      - '**.md'
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────
  #  Job 1: 빠른 검사 (의존성 설치 없이)
  # ─────────────────────────────────────────
  quick-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 1) 순환 참조 & 레이어 위반 검사
      - name: 🔍 Import 순환 참조 검사
        run: python scripts/check_deps.py

      # 2) except Exception: pass 잔존 검사
      - name: 🔇 Silent Exception 검출
        run: python scripts/check_silent_exceptions.py

      # 3) [v20.8] 계약 위반 탐지 게이트
      - name: 📋 Contract Gate (Policy SSOT + Feature Contract)
        run: python check_contract_gate.py

      # 4) 모든 .py 파일 구문 체크
      - name: 🐍 Python Syntax 검사
        run: |
          python -m py_compile main.py
          find . -name "*.py" -not -path "./__pycache__/*" -not -path "./test_*" \
            | head -30 \
            | xargs -I {} python -m py_compile {} 2>&1 \
            || { echo "❌ 구문 에러 발견"; exit 1; }

  # ─────────────────────────────────────────
  #  Job 2: 테스트 (의존성 설치 필요)
  # ─────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    needs: quick-checks    # 빠른 검사 통과 후에만 실행

    env:
      PYTHONUNBUFFERED: '1'
      BCRYPT_COST: '4'       # 테스트는 빠른 cost 사용 (Tip #5)
      STORAGE_SECRET: 'ci-test-secret-key-12345'
      LOG_TO_FILE: 'false'   # CI에서는 stdout만

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 의존성 캐시
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements_nicegui.txt') }}
          restore-keys: pip-

      - name: 📦 의존성 설치
        run: |
          pip install --upgrade pip
          pip install -r requirements_nicegui.txt
          pip install bcrypt>=4.0.0 pytest

      - name: 🧪 테스트 실행
        run: |
          # [v20.8] 정책 일관성 + 체결 엔진 테스트
          python -m pytest test_policy_consistency.py -v --tb=short 2>/dev/null || \
          echo "⚠️ 정책 일관성 테스트 스킵"

          python -m pytest test_trade_plan.py -v --tb=short 2>/dev/null || \
          echo "⚠️ 체결 엔진 테스트 스킵"

          # 보안 테스트
          python -m pytest tests/test_auth_migration.py -v --tb=short 2>/dev/null || \
          python -m pytest test_security.py -v --tb=short 2>/dev/null || \
          echo "⚠️ 보안 테스트 파일 없음 (스킵)"

          # 기존 테스트
          python -m pytest test_ml_engine.py -v --tb=short 2>/dev/null || \
          echo "⚠️ ML 테스트 스킵 (모델 파일 없음)"

      - name: 📊 테스트 결과 요약
        if: always()
        run: echo "✅ CI 완료 — $(date +'%Y-%m-%d %H:%M KST')"
