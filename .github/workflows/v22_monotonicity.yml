# .github/workflows/v22_monotonicity.yml
# ═══════════════════════════════════════════════
# SwingPicker v22 Monotonicity / CI HARD Gate
# ─ 참조: SwingPicker_v22_Final_Consolidated.md §3
#
# [v22.2] 변경:
#   · monotonicity_report 부재 정책을 이벤트별로 분리:
#     - pull_request → SKIP (PR 작업자가 collector를 못 돌릴 수 있음)
#     - schedule / push to main → FAIL
#   · continue-on-error 제거 (이전 단계에서 이미 함, 유지)
# ═══════════════════════════════════════════════
name: v22 Monotonicity

on:
  push:
    branches: [main, "feature/v22-*"]
    paths:
      - "data/recommend_latest.csv"
      - "data/winrate_table_*.json"
      - "data/top_pick_*.json"
      - "shared_utils.py"
      - "scoring_engine.py"
      - "pipeline_calibrate.py"
      - "pipeline_finalize.py"
      - "kelly_calibrator.py"
      - "auto_backtest.py"
      - "daily_briefing.py"
      - ".github/workflows/v22_monotonicity.yml"
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 7 * * 1-5"   # KST 16:30 (장 마감 + collector 30분 후)
  workflow_dispatch:

concurrency:
  group: v22-mono-${{ github.ref }}
  cancel-in-progress: true

jobs:
  monotonicity-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy pytest

      - name: 🧪 Route 계약 테스트
        run: python -m pytest test_route_contract_v22.py -v --tb=short

      - name: 📊 monotonicity_report 생성
        id: monobuild
        env:
          PYTHONUTF8: "1"
        run: |
          YMD=$(date -u +"%Y%m%d")
          echo "asof_ymd=$YMD" >> $GITHUB_OUTPUT
          mkdir -p data

          # [v56] 종전엔 실패를 `|| echo ::warning::`로 삼켰다. 리포트 파일은
          #   git에 커밋돼 있으므로, 생성이 실패해도 체크아웃된 **과거 리포트**가
          #   남아 다음 step이 그것을 검증하고 통과했다(날짜 비교 없음).
          #   → PR에서는 여전히 경고로 넘기되(작업자가 collector를 못 돌림),
          #     push/schedule에서는 생성 실패를 그대로 실패로 만든다.
          #     추가로 다음 step이 asof_ymd를 기대 날짜와 대조한다.
          if python daily_briefing.py data $YMD; then
            echo "briefing_ok=1" >> $GITHUB_OUTPUT
          else
            echo "briefing_ok=0" >> $GITHUB_OUTPUT
            echo "::warning::daily_briefing 실행 실패 (collector 미실행 가능성)"
            if [ "${{ github.event_name }}" != "pull_request" ] && \
               [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
              echo "::error::push/schedule에서는 리포트 생성 실패를 통과시키지 않습니다."
              exit 1
            fi
          fi

      # [v56] 인라인 python → scripts/check_monotonicity_gate.py 로 이관.
      #   YAML 안의 코드는 테스트할 수 없어서 '스테일 리포트 수용' 구멍이
      #   오래 남아 있었다. 이제 tests/test_v56_gate_liveness.py가 검증한다.
      - name: 🛡️ CI HARD Gate 검증
        env:
          PYTHONUTF8: "1"
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python scripts/check_monotonicity_gate.py \
            --report data/monotonicity_report_latest.json \
            --event "${{ github.event_name }}" \
            --expect-ymd "${{ steps.monobuild.outputs.asof_ymd }}"

      - name: 📤 monotonicity_report 아티팩트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monotonicity-report-${{ steps.monobuild.outputs.asof_ymd }}
          path: |
            data/monotonicity_report_*.json
            data/top_pick_validation_*.json
            data/top_pick_funnel_*.json
          if-no-files-found: warn
          retention-days: 30
