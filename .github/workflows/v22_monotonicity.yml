# .github/workflows/v22_monotonicity.yml
# ═══════════════════════════════════════════════
# SwingPicker v22 Monotonicity / CI HARD Gate
# ─ 참조: SwingPicker_v22_Final_Consolidated.md §3
#
# 동작:
#   1. daily_briefing.py로 monotonicity_report 생성
#   2. ci_hard_all_pass 검증 (실패 시 워크플로우 빨강)
#   3. SOFT warning 요약 출력
#
# 운영 단계:
#   - Week 1~2 (이번 PR 시점): continue-on-error: true → REPORT-ONLY
#     (실패해도 PR merge 가능, 알람만)
#   - Week 3~4: continue-on-error 제거 → SOFT BLOCK
#     (HARD FAIL 시 PR 빨강, 그래도 force-merge 가능)
#   - MATURE (n_trades ≥ 100, winrate_table 안정): branch protection rule
#     로 HARD ENFORCE (PR merge 차단)
# ═══════════════════════════════════════════════
name: v22 Monotonicity

on:
  push:
    branches: [main, "feature/v22-*"]
    paths:
      - "data/recommend_latest.csv"
      - "data/winrate_table_*.json"
      - "data/top_pick_*.json"
      - "shared_utils.py"
      - "scoring_engine.py"
      - "pipeline_calibrate.py"
      - "pipeline_finalize.py"
      - "kelly_calibrator.py"
      - "auto_backtest.py"
      - "daily_briefing.py"
      - ".github/workflows/v22_monotonicity.yml"
  pull_request:
    branches: [main]
  # 매일 한국 시간 16:30 (장 마감 + collector 30분 후) 기준 KST = UTC 07:30
  schedule:
    - cron: "30 7 * * 1-5"
  # 수동 실행
  workflow_dispatch:

concurrency:
  group: v22-mono-${{ github.ref }}
  cancel-in-progress: true

jobs:
  monotonicity-check:
    runs-on: ubuntu-latest
    # ───────────────────────────────────────
    # [v22 운영 가이드]
    # 첫 1주일: REPORT-ONLY 모드 (continue-on-error: true)
    # 이후 단계적으로 false 전환:
    #   Week 3+: continue-on-error: false (PR 빨강)
    # ───────────────────────────────────────
    continue-on-error: true   # ⚠️ Week 3+ 에는 false로 변경

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          # 본 워크플로우는 pandas/numpy만 있으면 충분
          pip install pandas numpy pytest

      - name: 🧪 Route 계약 테스트
        run: |
          python -m pytest test_route_contract_v22.py -v --tb=short

      - name: 📊 monotonicity_report 생성
        id: monobuild
        env:
          PYTHONUTF8: "1"
        run: |
          # 어제 날짜 기준 (오늘 collector 안 돌았을 가능성 대비)
          YMD=$(date -u +"%Y%m%d")
          echo "asof_ymd=$YMD" >> $GITHUB_OUTPUT
          
          # data/ 디렉토리 없으면 생성 (첫 실행 방어)
          mkdir -p data
          
          # daily_briefing 단독 실행 — monotonicity_report 자동 생성
          # 이미 collector가 돌았다면 recommend_latest.csv 존재
          # 없으면 monotonicity_report에 빈 데이터 + SKIP gate로 정상 종료
          python daily_briefing.py data $YMD || echo "⚠️ daily_briefing 실패 (collector 미실행 가능성)"

      - name: 🛡️ CI HARD Gate 검증
        env:
          PYTHONUTF8: "1"
        run: |
          python <<'PYEOF'
          import json, sys, os
          
          path = "data/monotonicity_report_latest.json"
          if not os.path.exists(path):
              print("⚠️ monotonicity_report_latest.json 없음 — collector 미실행 가능성")
              print("   첫 1주일은 데이터 누적 단계, SKIP 처리")
              sys.exit(0)
          
          with open(path, "r", encoding="utf-8") as f:
              r = json.load(f)
          
          print("=" * 60)
          print(f"📊 monotonicity_report ({r.get('asof_ymd')})")
          print("=" * 60)
          
          # 핵심 지표
          print(f"  TOP_PICK count: {r.get('top_pick_count', 0)}")
          print(f"  declared_wr_top_pick: {r.get('declared_wr_top_pick')}")
          print(f"  declared_wr_active:   {r.get('declared_wr_active')}")
          print(f"  realized_wr:          {r.get('realized_wr')}")
          print(f"  gap (top_pick):       {r.get('declared_vs_realized_gap_top_pick')}")
          print(f"  gap (active):         {r.get('declared_vs_realized_gap_active')}")
          print(f"  avg_ret_excess_pct:   {r.get('avg_ret_excess_pct')}")
          print(f"  market_map_coverage:  {r.get('market_map_coverage')}")
          print(f"  stable_7day_avg:      {r.get('top_pick_stable_7day_avg')}")
          print()
          
          # HARD gates
          print("🛡️ HARD Gates:")
          for g in r.get("ci_hard", []):
              icon = {"PASS": "✅", "FAIL": "❌", "SKIP": "⏭️"}.get(g["status"], "❓")
              print(f"  {icon} {g['gate']}: {g['status']} ({g.get('detail', '')})")
          
          # SOFT gates
          print("\n💡 SOFT Gates:")
          for g in r.get("ci_soft", []):
              icon = {"OK": "✅", "WARN": "⚠️"}.get(g["status"], "❓")
              print(f"  {icon} {g['gate']}: {g['status']} ({g.get('detail', '')})")
          
          # 최종 판정
          hard_pass = r.get("ci_hard_all_pass", False)
          soft_warn = r.get("ci_soft_any_warn", False)
          
          print("\n" + "=" * 60)
          print(f"최종: HARD={'PASS ✅' if hard_pass else 'FAIL ❌'}, "
                f"SOFT={'WARN ⚠️' if soft_warn else 'OK ✅'}")
          print("=" * 60)
          
          if not hard_pass:
              # continue-on-error: true 인 동안에는 워크플로우 자체는 ✅,
              # 이 step만 빨강 표시
              sys.exit(1)
          PYEOF

      - name: 📤 monotonicity_report 아티팩트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monotonicity-report-${{ steps.monobuild.outputs.asof_ymd }}
          path: |
            data/monotonicity_report_*.json
            data/top_pick_validation_*.json
            data/top_pick_funnel_*.json
          if-no-files-found: warn
          retention-days: 30
