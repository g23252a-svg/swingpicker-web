# .github/workflows/prefetch_flow.yml
# 수급 데이터 선수집 — collector.py 본체와 분리된 전용 job
#
# 실행 순서:
#   1. prefetch_flow (이 workflow): 장 마감 직후 수급 수집 → flow_cache_latest.json 저장
#   2. auto_collect   (기존 workflow): flow_cache_latest.json 읽어서 분석
#
# 스케줄: 평일 15:35~15:50 KST (UTC 06:35) — KRX 마감(15:30) 직후
name: Prefetch Flow Data

on:
  schedule:
    - cron: "35 6 * * 1-5"   # 15:35 KST
  workflow_dispatch:
    inputs:
      trade_date:
        description: "기준일 (YYYYMMDD, 빈칸=오늘)"
        required: false
        default: ""

permissions:
  contents: write
  actions: write     # [v81] auto_collect 체인 dispatch

jobs:
  prefetch:
    runs-on: ubuntu-latest

    env:
      PYTHONUNBUFFERED: "1"
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      TZ: Asia/Seoul

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pykrx
        run: |
          pip install pykrx pandas pyarrow requests --quiet


      - name: Prefetch investor flow
        id: prefetch
        run: |
          python prefetch_flow.py ${{ github.event.inputs.trade_date || '' }}
          echo "status=$?" >> $GITHUB_OUTPUT
        continue-on-error: true   # 수급 실패해도 collector는 진행

      - name: Show cache result
        run: |
          echo "=== flow_cache_latest.json ==="
          cat data/flow_cache_latest.json 2>/dev/null || echo "(없음)"

      - name: Commit & Push cache
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/flow_cache_latest.json data/flow_*.json data/flow_full_*.parquet || true
          git diff --staged --quiet || {
            git commit -m "chore: prefetch flow cache $(date +'%Y-%m-%d %H:%M:%S %Z')"
            git fetch origin main
            git merge origin/main --no-edit -X ours --allow-unrelated-histories || true
            git push origin main
          }
          echo "Done."

      # [v81] 배치 체인 — auto_collect의 cron(11:23Z)은 8/27 이후 매일 3~4시간 늦게
      #   자정 넘어 발화해 가드에 스킵되고, 외부 감시자는 4일 중 1일만 성공했다
      #   (9/4·9/8·9/9 배치 누락 → 화면이 9/7 픽을 사흘 보여줌). 반면 이 워크플로의
      #   cron은 늦더라도 매일 저녁(20:33~22:02 KST)에는 꼭 발화한다. 그래서 여기서
      #   오늘자 CSV가 없으면 auto_collect를 dispatch한다 — dispatch는 가드를 우회하고
      #   배치는 멱등이다. GITHUB_TOKEN은 workflow_dispatch 생성이 허용된다.
      - name: Chain auto_collect if today's batch is missing
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TODAY=$(TZ=Asia/Seoul date +%Y%m%d)
          git fetch origin main --quiet || true
          if git cat-file -e "origin/main:data/recommend_${TODAY}.csv" 2>/dev/null; then
            echo "recommend_${TODAY}.csv 이미 있음 — 체인 생략"
          elif [ "$(TZ=Asia/Seoul date +%u)" -ge 6 ]; then
            echo "주말 — 체인 생략"
          else
            echo "오늘 배치 없음 — auto_collect dispatch"
            gh workflow run auto_collect.yml --ref main
          fi
