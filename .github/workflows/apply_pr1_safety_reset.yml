name: Apply PR1 Safety Reset

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'codex/pr1-safety-reset-v2511'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/pr1-safety-reset-v2511
          fetch-depth: 0

      - name: Decode and verify reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .pr1_payload -name 'part*.b64' | wc -l)" -eq 10
          cat .pr1_payload/part*.b64 | base64 --decode > /tmp/pr1_safety_reset.patch
          echo '407a866cdfac176f999514332299fad691433fb6915313f300d8ba86e418770c  /tmp/pr1_safety_reset.patch' | sha256sum -c -
          git apply --check \
            --exclude='.github/workflows/auto_collect.yml' \
            --exclude='.github/workflows/ci.yml' \
            /tmp/pr1_safety_reset.patch

      - name: Apply and commit source safety reset
        shell: bash
        run: |
          set -euo pipefail
          git apply \
            --exclude='.github/workflows/auto_collect.yml' \
            --exclude='.github/workflows/ci.yml' \
            /tmp/pr1_safety_reset.patch
          rm -rf .pr1_patch .pr1_payload
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- ':!.github/workflows/apply_pr1_safety_reset.yml'
          git commit -m 'fix(v25.1.1): apply PR1 Safety Reset source changes'
          git push origin HEAD:codex/pr1-safety-reset-v2511
