name: Apply PR1 Safety Reset

on:
  push:
    branches:
      - codex/pr1-safety-reset-v2511
    paths:
      - '.pr1_patch/**'
      - '.github/workflows/apply_pr1_safety_reset.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/pr1-safety-reset-v2511
          fetch-depth: 0

      - name: Decode and apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cat .pr1_patch/*.b64 | base64 --decode > /tmp/pr1_safety_reset.patch
          git apply --check /tmp/pr1_safety_reset.patch
          git apply /tmp/pr1_safety_reset.patch
          rm -rf .pr1_patch
          rm -f .github/workflows/apply_pr1_safety_reset.yml

      - name: Commit applied patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(v25.1.1): apply PR1 Safety Reset'
          git push origin HEAD:codex/pr1-safety-reset-v2511
