name: Backfill Investor Flow (v79)

# 수동 실행 전용. 과거 세션의 전종목 수급(외국인·기관합계 순매수)을 pykrx로
# 받아 data/flow_full_{ymd}.parquet 로 저장하고 커밋한다. 이미 있는 날은 건너뛴다.
on:
  workflow_dispatch:
    inputs:
      start:
        description: "시작일 YYYYMMDD"
        required: true
        default: "20260226"
      end:
        description: "종료일 YYYYMMDD"
        required: true
        default: "20260831"

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -q -r requirements.txt
      - name: Backfill
        env:
          PYTHONUNBUFFERED: "1"
        run: python scripts/backfill_flow_full.py --start "${{ inputs.start }}" --end "${{ inputs.end }}" --sleep 1.0
      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/flow_full_*.parquet || true
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "data: 수급 전종목 백필 ${{ inputs.start }}~${{ inputs.end }} (v79)"
          git pull --rebase origin main
          git push origin HEAD:main
